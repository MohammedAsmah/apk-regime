<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat AI (Tor/Local)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        #chat-log { height: 400px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; background: #f9f9f9; margin-bottom: 10px; }
        .message { padding: 8px; margin: 5px 0; border-radius: 5px; }
        .user { background-color: #e3f2fd; text-align: right; margin-left: 20%; }
        .assistant { background-color: #d1e7dd; text-align: left; margin-right: 20%; }
        .system { color: gray; font-size: 0.8em; text-align: center; }
        input[type="text"] { width: 70%; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
        #token-area { margin-bottom: 20px; padding: 10px; background: #eee; }
    </style>
</head>
<body>
    <h2>🤖 NutriFit AI Chat Test</h2>

    <div id="token-area">
        <label for="auth-token">JWT Access Token:</label><br>
        <input type="text" id="auth-token" placeholder="Coller le token ici..." style="width: 100%;">
        <button onclick="connectChat()">🔌 Connect WebSocket</button>
    </div>

    <div id="chat-log" role="log" aria-live="polite"></div>
    
    <div style="display: flex;">
        <input id="chat-message-input" type="text" placeholder="Posez une question nutrition..." disabled>
        <button id="chat-message-submit" disabled>Envoyer</button>
    </div>

    <script>
        let chatSocket = null;
        let sessionId = null;

        function connectChat() {
            const tokenInput = document.getElementById('auth-token');
            const token = tokenInput.value.trim();
            if (!token) { alert("Token requis!"); return; }

            const protocol = window.location.protocol === "https:" ? "wss" : "ws";
            const host = window.location.host;
            const url = `${protocol}://${host}/ws/chat/?token=${token}`;

            chatSocket = new WebSocket(url);

            chatSocket.onopen = function() {
                log("--- Connecté au serveur ---", "system");
                document.getElementById('chat-message-input').disabled = false;
                document.getElementById('chat-message-submit').disabled = false;
            };

            chatSocket.onmessage = function(e) {
                try {
                    const data = JSON.parse(e.data);
                    if (data.error) {
                        log("Erreur: " + data.error, "system");
                    } else {
                        if (data.session_id) sessionId = data.session_id;
                        log(data.message, "assistant");
                    }
                } catch (err) {
                    console.error("Failed to parse message", err);
                }
            };

            chatSocket.onclose = function() {
                log("--- Déconnecté ---", "system");
                document.getElementById('chat-message-input').disabled = true;
                document.getElementById('chat-message-submit').disabled = true;
            };

            chatSocket.onerror = function(err) {
                console.error("WebSocket error", err);
                log("--- Erreur de connexion ---", "system");
            };
        }

        function log(message, type) {
            const chatLog = document.getElementById('chat-log');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = document.createElement('b');
            label.textContent = `${type.toUpperCase()}: `;
            
            const content = document.createElement('span');
            content.textContent = message;
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(content);
            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        document.getElementById('chat-message-submit').onclick = function() {
            const input = document.getElementById('chat-message-input');
            const message = input.value.trim();
            if (!message || !chatSocket) return;
            
            chatSocket.send(JSON.stringify({
                'message': message,
                'session_id': sessionId 
            }));
            
            log(message, "user");
            input.value = '';
        };

        document.getElementById('chat-message-input').onkeypress = function(e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-message-submit').click();
            }
        };
    </script>
</body>
</html>
